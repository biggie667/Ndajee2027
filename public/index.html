<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NDAGE 2026 Accréditation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#F3F7FD;--card:#FFFFFF;--line:#E0E8F5;--line2:#CBD8EE;
  --ink:#0E1E3C;--ink2:#465773;--ink3:#7F8FAB;
  --blue:#2563EB;--blue-d:#1D4ED8;--navy:#16306B;--sky:#EAF2FF;--sky2:#D7E6FF;--sky3:#F6FAFF;
  --ok:#0F7B55;--ok-bg:#E6F6EF;--warn:#A85F00;--warn-bg:#FFF4DC;--bad:#C0262D;--bad-bg:#FDECEC;--vio:#5B3FC4;--vio-bg:#EFEBFD;--mute-bg:#EEF2F8;
  --r:10px;--sh:0 1px 2px rgba(22,48,107,.05),0 4px 14px rgba(22,48,107,.05);
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;--fd:'Inter Tight','Inter',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13.5px/1.45 var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--fd);margin:0;letter-spacing:-.01em}
a{color:var(--blue)}
.num{font-variant-numeric:tabular-nums}

[hidden]{display:none!important}
#login{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#EAF2FF,#F3F7FD 55%)}
.login{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(22,48,107,.12);padding:30px 30px 26px;width:380px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:20px}.login .btn{justify-content:center;padding:10px}
#pub{min-height:100%;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#EAF2FF,#F3F7FD 55%)}
#pub .login{width:520px}
.pub-ph{display:flex;gap:14px;align-items:center}.pub-ph img,.pub-ph .ph0{width:87px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line2);background:var(--mute-bg);flex:none}
.lnk{display:flex;gap:6px;margin:4px 0 10px}.lnk input{flex:1;font:12px ui-monospace,Menlo,monospace}
#l-err{margin:0;min-height:18px;color:var(--bad);font-size:12.5px;font-weight:500}
/* Shell */
.app{display:grid;grid-template-columns:252px 1fr;height:100%}
.side{background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 14px}
.brand-m{width:36px;height:36px;border-radius:9px;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 13px var(--fd);letter-spacing:.02em}
.brand b{display:block;font:700 14.5px var(--fd)}
.brand span{font-size:11px;color:var(--ink3)}
.nav{flex:1;overflow-y:auto;padding:4px 10px 16px}
.nav-g{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);padding:14px 10px 6px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--ink2);font-weight:500;text-align:left}
.nav-i svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover{background:var(--sky3);color:var(--ink)}
.nav-i.on{background:var(--sky);color:var(--blue-d);font-weight:600}
.nav-i .ct{margin-left:auto;font-size:11px;font-weight:600;background:var(--mute-bg);color:var(--ink2);border-radius:20px;padding:1px 7px}
.nav-i .ct.hot{background:var(--warn-bg);color:var(--warn)}
.side-f{border-top:1px solid var(--line);padding:12px 18px;font-size:11px;color:var(--ink3)}
.wrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:18px}
.top .sub{font-size:12px;color:var(--ink3)}
.top .sp{flex:1}
.btn.menu-b{display:none}
.main{flex:1;overflow-y:auto;padding:22px 26px 40px}
.sess{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}

/* Bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14.5px}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--line2)}
.kpi small{display:block;font-size:11.5px;color:var(--ink3);font-weight:500}
.kpi b{display:block;font:700 26px/1.2 var(--fd);margin-top:4px}
.kpi em{font-style:normal;font-size:11.5px;color:var(--ink2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--sky3)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff}.btn.p:hover{background:var(--blue-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{color:var(--bad);border-color:#F1C3C5}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.inp{border:1px solid var(--line2);border-radius:8px;padding:7px 10px;background:#fff;min-width:0;max-width:100%}
.inp:focus{outline:2px solid var(--sky2);border-color:var(--blue)}
textarea.inp{width:100%;min-height:84px;resize:vertical}
.tb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;font-weight:600;color:var(--ink2)}
.fld .inp{width:100%}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-DRAFT{background:var(--mute-bg);color:var(--ink2)}.s-SUB{background:var(--sky);color:var(--blue-d)}
.s-RET{background:var(--warn-bg);color:var(--warn)}.s-APP{background:var(--ok-bg);color:var(--ok)}
.s-REJ{background:var(--bad-bg);color:var(--bad)}.s-PRT{background:var(--vio-bg);color:var(--vio)}
.s-DLV{background:#E3F4F7;color:#0B6B7E}.s-PEND{background:var(--warn-bg);color:var(--warn)}
.s-OK{background:var(--ok-bg);color:var(--ok)}.s-NO{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-block;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:600;background:var(--mute-bg);color:var(--ink2);margin:1px 2px 1px 0}
.chip.w{background:var(--warn-bg);color:var(--warn)}.chip.b{background:var(--bad-bg);color:var(--bad)}.chip.k{background:#111;color:#fff;font-family:ui-monospace,Menlo,monospace}.chip.x{background:var(--sky);color:var(--blue-d)}
.cat-d{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);text-align:left;padding:9px 12px;background:var(--sky3);border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tbody tr.row{cursor:pointer}.t tbody tr.row:hover{background:var(--sky3)}
.t .c{text-align:center}.t .r{text-align:right}
.t small{color:var(--ink3);display:block}
.empty{padding:34px 18px;text-align:center;color:var(--ink3)}
.pg{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink2)}
.bar-row{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px}
.bar-t{height:8px;border-radius:5px;background:var(--mute-bg);overflow:hidden}.bar-t i{display:block;height:100%;border-radius:5px;background:var(--blue)}
.flow{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--mute-bg);margin:6px 0 12px}
.flow i{display:block;height:100%}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink2)}
.lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.note{background:var(--sky);border:1px solid var(--sky2);color:var(--navy);border-radius:8px;padding:10px 14px;font-size:12.5px;margin-bottom:16px}
.note.w{background:var(--warn-bg);border-color:#F3DDA7;color:#6B3D00}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;color:var(--ink2);cursor:pointer;font-size:12.5px}
.tab.on{background:var(--sky);color:var(--blue-d)}
.mx th,.mx td{text-align:center;padding:8px 6px}.mx th:first-child,.mx td:first-child{text-align:left;padding-left:14px}
.mx input{width:16px;height:16px;accent-color:var(--blue)}
.sw{width:26px;height:26px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line2);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--blue)}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rep button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:13px 15px;cursor:pointer}
.rep button:hover,.rep button.on{border-color:var(--blue);background:var(--sky3)}
.rep b{display:block;font:700 13.5px var(--fd)}.rep span{font-size:12px;color:var(--ink3)}

/* Overlays */
.ov{position:fixed;inset:0;background:rgba(14,30,60,.38);display:flex;z-index:50}
.ov.m{align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:14px;width:560px;max-width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(14,30,60,.25)}
.modal.wide{width:900px}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:16px;flex:1}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.ov.d{justify-content:flex-end}
.drawer{background:var(--card);width:560px;max-width:100%;height:100%;display:flex;flex-direction:column;box-shadow:-12px 0 40px rgba(14,30,60,.18)}
.xb{border:0;background:var(--mute-bg);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;line-height:1}
.dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:13px}.dl dt{color:var(--ink3)}.dl dd{margin:0;font-weight:500}
.sec{font:700 11px var(--f);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:18px 0 8px}
.hist{font-size:12.5px;border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.hist div{padding:4px 0}.hist small{color:var(--ink3)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px)}

/* Accréditation (badge) : tout en em, mis à l'échelle par font-size */
.bdg{font-size:var(--bs,9px);width:32.5em;height:46em;background:#fff;color:#000;padding:2em 2em 2.2em;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;line-height:1.2;flex:none;border:1px solid #D9DFEA}
.bdg>*{flex:none}.bdg svg{display:block}
.b-top{display:flex;gap:1.6em;height:14.6em}
.b-ph{width:11.6em;height:14.6em;background:#EEF1F5;flex:none;overflow:hidden}
.b-ph img,.b-ph svg{width:100%;height:100%;object-fit:cover}
.b-tr{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.b-ev{font-size:.95em;font-weight:700;letter-spacing:.06em;text-align:right;color:#222;text-transform:uppercase}
.b-ev small{display:block;font-size:.85em;font-weight:400;letter-spacing:.02em;color:#555;text-transform:none}
.b-ban{color:#fff;font-weight:700;font-size:1.55em;text-align:center;padding:.42em .3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-name{font-size:1.75em;margin-top:.75em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b-fn{font-weight:700;font-size:.98em;margin-top:.15em}.b-org{font-size:.98em}
.b-mid{display:flex;justify-content:space-between;align-items:flex-end;margin-top:1em;padding-left:6.6em;min-height:7.2em}
.b-meal{width:2.6em;height:2.6em;border:.12em solid #000;display:grid;place-items:center;margin-bottom:.2em}
.b-meal svg{width:1.5em;height:1.7em}
.b-qr{width:6em;margin-left:auto}.b-qr b{display:block;font-size:.92em;margin-bottom:.25em;white-space:nowrap}
.b-qr svg{width:6em;height:6em}
.b-zones{display:flex;flex-wrap:wrap;gap:1em 1.5em;margin:1.6em 0 1.6em}
.b-z{width:4.2em;height:2em;background:#000;color:#fff;font-weight:700;font-size:1em;display:grid;place-items:center;border:.12em solid #000;letter-spacing:.01em}
.b-z span{font-size:1.5em;line-height:1}
.b-z.o{background:#fff;color:#000}
.bdg>.b-bar{margin-top:auto;height:5.4em;display:flex;align-items:center;justify-content:space-around;color:#fff;flex:none}
.b-bar span{font-size:3.3em;line-height:1}
.b-bk{display:flex;gap:1.3em}
.b-bk .b-ph{width:6.2em;height:7.8em}
.b-bk h4{margin:1.1em 0 0;font:900 1.25em Arial,Helvetica,sans-serif;text-transform:uppercase}
.b-bk p{margin:.15em 0 0;font-weight:700;font-size:.95em}.b-bk p.i{margin-top:1.2em}
.b-leg{display:grid;grid-template-columns:1fr 1fr;gap:0 1em;margin-top:1.1em;font-size:.72em}
.b-leg>div{min-width:0}.b-leg>div>div{display:flex;align-items:center;gap:.7em;padding:.32em 0;min-width:0}
.b-leg i{font-style:normal;font-weight:700;font-size:1.25em;display:grid;place-items:center;flex:none;width:2.7em;height:1.35em;background:#000;color:#fff;border:.1em solid #000}
.b-leg i.o{background:#fff;color:#000}.b-leg i.n{width:1.5em;height:1.5em;background:#fff;color:#000}
.b-leg i.c{width:1.5em;height:1.5em;border:0}.b-leg i.f{width:1.5em;height:1.5em;background:#fff}.b-leg i.f svg{width:.8em;height:1em}
.pair{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;background:#DCE6F5;border-radius:var(--r);padding:22px}
.pair .bdg{box-shadow:0 6px 22px rgba(14,30,60,.18)}
#printarea{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:262px;z-index:40;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(14,30,60,.2)}
  .app.nav-open .side{transform:none}
  .btn.menu-b{display:inline-flex}
  .top{padding:10px 16px}.main{padding:16px 16px 32px}
  .g2,.g3,.form{grid-template-columns:1fr}
  .bar-row{grid-template-columns:110px 1fr 36px}
  .dl{grid-template-columns:110px 1fr}
  .pair .bdg{font-size:7px}
}
@media print{
  @page{size:A5 landscape;margin:0}
  html,body{height:auto;background:#fff}
  body>*:not(#printarea){display:none!important}
  #printarea{display:block}
  .sheet{display:flex;gap:0;justify-content:center;align-items:flex-start;page-break-after:always;break-after:page}
  .sheet .bdg+.bdg{border-left:.2mm dashed #999}
  .sheet .bdg{font-size:3.21mm;border:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div id="pub" hidden></div>
<div id="login" hidden>
  <form class="login" onsubmit="doLogin(event)">
    <div class="brand" style="padding:0 0 18px"><div class="brand-m">DG</div><div><b>NDAGE 2026</b><span>Système d'accréditation</span></div></div>
    <h2>Connexion</h2>
    <div class="fld"><label for="l-em">E-mail</label><input class="inp" id="l-em" type="email" autocomplete="username" required></div>
    <div class="fld"><label for="l-pw">Mot de passe</label><input class="inp" id="l-pw" type="password" autocomplete="current-password" required></div>
    <p id="l-err" role="alert"></p>
    <button class="btn p" id="l-btn" type="submit">Se connecter</button>
  </form>
</div>
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="brand-m">DG</div><div><b>NDAGE 2026</b><span>Système d'accréditation</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-f">DG Groupe · v18<br>Données de démonstration</div>
  </aside>
  <div class="wrap">
    <header class="top" id="top"></header>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="ovs"></div>
<div id="printarea"></div>
<div id="toast" hidden></div>
<script>
'use strict';
/* ============ Référentiels ============ */
const ST={DRAFT:'Brouillon',SUB:'Soumis',RET:'À corriger',APP:'Approuvé',REJ:'Refusé',PRT:'Imprimé',DLV:'Remis'};
const ST_COL={DRAFT:'#B8C3D6',SUB:'#2563EB',RET:'#E0A100',APP:'#0F9D6C',REJ:'#D0383F',PRT:'#6D4FD6',DLV:'#0E8FA6'};
const RQ={PEND:'En attente',OK:'Accordé',NO:'Refusé'};
const PERMS=[['view','Consulter les dossiers'],['edit','Créer / modifier'],['review','Valider / refuser'],['access','Décider des ajouts d\'accès'],['matrix','Modifier la matrice'],['print','Imprimer / remettre'],['export','Exporter les rapports'],['admin','Gérer utilisateurs & rôles']];
const NAV=[
 ['Pilotage',[['dash','Tableau de bord','grid'],['events','Événements','cal']]],
 ['Accréditation',[['dem','Demandes','file'],['inv','Invitations','mail'],['revue','Revue des données','check'],['verif','Vérifications','shield']]],
 ['Populations',[['ath','Athlètes & équipes','medal'],['fi','Fédérations internationales','globe'],['fn','Fédérations nationales','flag'],['staff','Staff','brief'],['media','Médias','mic'],['vol','Volontaires','heart']]],
 ['Accès & privilèges',[['matrix','Matrice d\'accès','table'],['acces','Ajouts d\'accès','plus']]],
 ['Production',[['tpl','Template d\'accréditation','card'],['print','Impression','printer']]],
 ['Analyse',[['rep','Rapports & exports','chart']]],
 ['Administration',[['users','Utilisateurs & rôles','users'],['audit','Journal d\'audit','clock']]]
];
const TITLES={};NAV.forEach(g=>g[1].forEach(i=>TITLES[i[0]]=i[1]));
const IC={
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',

async function api(path,body){const r=await fetch(path,body===undefined?{credentials:'same-origin'}:{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  let j={};try{j=await r.json()}catch(e){}return{ok:r.ok,status:r.status,j}}
function save(){clearTimeout(TMR);TMR=setTimeout(flush,250)}
function flush(){TMR=0;SYNC=SYNC.then(async()=>{
  if(!S||!LAST)return;const n=snapOf(),b={},au=S.audit.filter(a=>a._n);
  const pu=S.persons.filter(p=>LAST.p.get(p.id)!==n.p.get(p.id)),pd=[...LAST.p.keys()].filter(id=>!n.p.has(id));
  if(pu.length||pd.length)b.persons={up:pu,del:pd};
  const ru=S.reqs.filter(q=>LAST.r.get(q.id)!==n.r.get(q.id));if(ru.length)b.reqs={up:ru};
  const uu=S.users.filter(u=>LAST.u.get(u.id)!==n.u.get(u.id));if(uu.length)b.users={up:uu};
  ['roles','cats','zones','privs','matrix','tpl','events'].forEach(k=>{if(LAST[k]!==n[k])b[k]=S[k]});
  if(au.length)b.audit=au;
  if(!Object.keys(b).length)return;
  let r;try{r=await api('/api/sync',b)}catch(e){r={ok:false,status:0,j:{error:'Connexion au serveur impossible.'}}}
  if(r.ok){au.forEach(a=>delete a._n);uu.forEach(u=>{delete u.pw;n.u.set(u.id,JSON.stringify(u))});LAST=n;return}
  if(r.status===401){showLogin(r.j.error);return}
  closeAll();await reload();toast('Non enregistré — '+(r.j.error||'erreur serveur'));
}).catch(e=>console.error(e))}
async function reload(){const r=await api('/api/state');if(r.status===401){showLogin();return false}if(!r.ok){showLogin(r.j.error||'Serveur indisponible.');return false}
  if(r.j.client){CL=r.j;S=null;LAST=null;await showForm('');return true}
  CL=null;$('#pub').hidden=true;  S=r.j;S.events=S.events||[];LAST=snapOf();LOADED=Date.now();$('#login').hidden=true;$('#app').hidden=false;render();return true}

     <td>${b?`<span class="chip ${blocking(p).length?'b':'w'}">${b} anomalie${b>1?'s':''}</span>`:'<span style="color:var(--ok);font-weight:600">Conforme</span>'}</td><td>${pill(p.st)}</td></tr>`}).join('')||'<tr><td colspan="9" class="empty">Aucun dossier ne correspond aux filtres.</td></tr>'}</tbody></table></div>

function setSt(id,st,why,quiet){
  const p=P(id);if(!p)return false;
  if(st==='APP'){const b=blocking(p);if(b.length){if(!quiet)toast('Approbation impossible : '+b.map(k=>rule(k)[1]).join(', '));return false}}
  p.st=st;p.note=['RET','REJ'].includes(st)?why||'':'';
  log('Statut',`${nm(p)} → ${ST[st]}${why?' ('+why+')':''}`,id);
  if(!quiet){closeAll();render();toast(nm(p)+' : '+ST[st]);if(st!=='REJ')openP(id)}return true;
}
function askWhy(id,st){const p=P(id);modal(st==='RET'?'Renvoyer pour correction':'Refuser le dossier',`<div class="fld"><label for="why">Motif communiqué au demandeur (obligatoire)</label><textarea class="inp" id="why" placeholder="Ex. : photo non conforme, fond non uni"></textarea></div>

  `<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn p" onclick="whyOk('${id}','${st}')">Confirmer</button>`)}
function whyOk(id,st){const w=$('#why').value.trim(),n=$('#why-n')?$('#why-n').value:'';if(!w){toast('Le motif est obligatoire');return}setSt(id,st,w);if(n)doNotify(id,n)}

   <div class="fld"><label for="e-grp" id="e-grp-l">${esc((EV(p.ev)||{gl:'Sous-classement'}).gl)}</label><input class="inp" id="e-grp" list="e-grps" value="${esc(p.grp||'')}" ${EV(p.ev)?'':'disabled'} placeholder="Choisir ou saisir"><datalist id="e-grps">${evGroups(EV(p.ev)).map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>`:''}
   <div class="fld full"><label for="e-addr">Adresse</label><input class="inp" id="e-addr" value="${esc(p.addr)}"></div>
   <div class="fld"><label for="e-tel">Téléphone</label><input class="inp" id="e-tel" type="tel" value="${esc(p.tel)}"></div><div class="fld"><label for="e-email">E-mail</label><input class="inp" id="e-email" type="email" value="${esc(p.email)}"></div>
   <div class="fld"><label for="e-ph">Photo d'identité</label><input class="inp" id="e-ph" type="file" accept="image/*" onchange="readPh(this)"></div>
   <div class="fld"><label>&nbsp;</label><label style="font-weight:500;display:flex;gap:8px;align-items:center"><input type="checkbox" id="e-doc" ${p.doc?'checked':''}> Pièce d'identité fournie et lisible</label></div></div>`,
  `${id&&can('admin')?`<button class="btn bad" style="margin-right:auto" onclick="delP('${id}')">Supprimer</button>`:''}<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn p" onclick="saveP('${id||''}')">Enregistrer</button>`);
}
function evGrpUI(k){const e=EV($('#'+k+'-ev').value),i=$('#'+k+'-grp');$('#'+k+'-grp-l').textContent=e?e.gl:'Sous-classement';i.disabled=!e;if(!e)i.value='';$('#'+k+'-grps').innerHTML=evGroups(e).map(g=>`<option value="${esc(g)}">`).join('')}
const evFields=(k,ev,grp)=>`<div class="fld"><label for="${k}-ev">Événement</label><select class="inp" id="${k}-ev" onchange="evGrpUI('${k}')">${opt(S.events.filter(e=>!e.arch).map(e=>[e.id,e.l+' ('+e.type+')']),ev||'','Non classé')}</select></div>
   <div class="fld"><label for="${k}-grp" id="${k}-grp-l">${esc((EV(ev)||{gl:'Sous-classement'}).gl)}</label><input class="inp" id="${k}-grp" list="${k}-grps" value="${esc(grp||'')}" ${EV(ev)?'':'disabled'} placeholder="Choisir ou saisir"><datalist id="${k}-grps">${evGroups(EV(ev)).map(g=>`<option value="${esc(g)}">`).join('')}</datalist></div>`;
function classAsk(){modal('Classer '+SEL.size+' dossier(s)',`<div class="form">${evFields('k',EV(UI.ev)?UI.ev:'','')}</div><p style="font-size:12px;color:var(--ink3);margin:10px 0 0">Les dossiers sélectionnés sont rattachés à l'événement choisi. « Non classé » retire le rattachement.</p>`,
  `<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn p" onclick="classDo()">Classer</button>`)}
function classDo(){const ev=$('#k-ev').value,grp=ev?$('#k-grp').value.trim():'',n=SEL.size;[...SEL].forEach(id=>{const p=P(id);if(p){p.ev=ev;p.grp=grp}});
  log('Événements',`${n} dossier(s) ${ev?'classé(s) dans « '+EV(ev).l+' »'+(grp?' — '+grp:''):'retiré(s) de leur événement'}`);SEL.clear();closeAll();render();toast(n+' dossier(s) classé(s)')}
function readPh(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=348;c.height=438;const k=Math.max(348/im.width,438/im.height),w=im.width*k,h=im.height*k;c.getContext('2d').drawImage(im,(348-w)/2,(438-h)/2,w,h);PH=c.toDataURL('image/jpeg',.82);toast('Photo chargée')};im.src=r.result};r.readAsDataURL(f)}
function saveP(id){
  const g=k=>$('#e-'+k).value.trim(),ln=g('ln'),fn=g('fn');if(!ln||!fn||!g('org')){toast('Nom, prénom et organisation sont obligatoires');return}
  let p=id?P(id):null;
  if(!p){const n=newId()+1+Math.floor(Math.random()*20);p={id:n+'-'+(10+Math.floor(Math.random()*80)),bg:'PEND',st:'DRAFT',xz:[],xp:[],xm:0,note:'',hasPh:false,photo:''};S.persons.unshift(p)}
  Object.assign(p,{ln,fn,sx:g('sx'),dob:g('dob'),cat:g('cat'),nat:g('nat'),org:g('org'),fct:g('fct'),addr:g('addr'),tel:g('tel'),email:g('email'),doc:$('#e-doc').checked});if($('#e-ev')){p.ev=g('ev');p.grp=p.ev?g('grp'):''}else{p.ev=p.ev||'';p.grp=p.grp||''}if(PH){p.photo=PH;p.hasPh=true}
  log('Dossiers',(id?'Modification de ':'Création de ')+nm(p),p.id);closeAll();render();openP(p.id);toast('Dossier enregistré');
}
function delP(id){const p=P(id);modal('Supprimer le dossier',`<p style="margin:0">Supprimer définitivement le dossier de <b>${esc(nm(p))}</b> ? Cette action est tracée dans le journal d'audit.</p>`,
  `<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn bad" onclick="doDel('${id}')">Supprimer</button>`)}
function importCSV(){modal('Import en masse',`<p style="margin:0 0 10px;color:var(--ink2)">Une ligne par personne, séparateur point-virgule. Les dossiers sont créés au statut « Brouillon ».</p>
  <pre style="background:var(--sky3);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;overflow-x:auto;margin:0 0 10px">nom;prenom;sexe;date_naissance;categorie;organisation;fonction;nationalite;evenement;sous_classement</pre>
  <p style="margin:0 0 6px;font-size:12px;color:var(--ink3)">Codes catégorie : ${S.cats.map(c=>c.c+' = '+esc(c.l)).join(', ')}.</p>
  <p style="margin:0 0 6px;font-size:12px;color:var(--ink3)">Les deux dernières colonnes sont facultatives : nom exact de l'événement${EV(UI.ev)?' (par défaut : '+esc(EV(UI.ev).l)+')':''} et sous-classement (sport, table, délégation…).</p>
  <textarea class="inp" id="imp" style="min-height:150px;font:12px ui-monospace,Menlo,monospace" placeholder="Diop;Awa;F;2009-04-12;ATH;Sénégal;Natation;Sénégal"></textarea>
  <div class="fld" style="margin-top:10px"><label for="imp-f">Ou charger un fichier CSV</label><input class="inp" id="imp-f" type="file" accept=".csv,.txt" onchange="const r=new FileReader();r.onload=()=>$('#imp').value=r.result;r.readAsText(this.files[0])"></div>`,
  `<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn p" onclick="doImport()">Importer</button>`)}
function doImport(){
  let ok=0,ko=0,seq=newId();const evBy=t=>{t=(t||'').toLowerCase();return S.events.find(e=>e.id.toLowerCase()===t||e.l.toLowerCase()===t)};
  $('#imp').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const a=l.split(/;|\t/).map(x=>x.trim());
    if(a[0].toLowerCase()==='nom')return;const c=(a[4]||'').toUpperCase();
    if(a.length<6||!a[0]||!a[1]||!S.cats.some(x=>x.c===c)){ko++;return}
    seq+=7;S.persons.unshift({id:seq+'-'+(10+ok%80),ln:a[0],fn:a[1],sx:(a[2]||'').toUpperCase()==='M'?'M':'F',dob:/^\d{4}-\d{2}-\d{2}$/.test(a[3])?a[3]:'',cat:c,org:a[5],fct:a[6]||'',nat:a[7]||'',ev:(evBy(a[8])||EV(UI.ev)||{id:''}).id,grp:(evBy(a[8])||EV(UI.ev))?a[9]||'':'',photo:'',hasPh:false,doc:false,bg:'PEND',st:'DRAFT',xz:[],xp:[],xm:0,note:''});ok++});
  if(!ok&&!ko){toast('Aucune ligne à importer');return}
  log('Dossiers',`Import en masse : ${ok} créé(s), ${ko} rejeté(s)`);closeAll();F.st='DRAFT';render();toast(`${ok} dossier(s) importé(s)${ko?`, ${ko} ligne(s) rejetée(s)`:''}`);
}
function doDel(id){const p=P(id),n=nm(p);S.persons=S.persons.filter(x=>x.id!==id);S.reqs=S.reqs.filter(q=>q.pid!==id);log('Dossiers','Suppression de '+n);closeAll();render();toast('Dossier supprimé')}

/* ============ Revue des données ============ */
V.revue=()=>{
  const live=PS().filter(p=>p.st!=='REJ'),sub=live.filter(p=>p.st==='SUB');
  const rows=(UI.rule?live.filter(p=>issues(p).includes(UI.rule)):sub).slice().sort((a,b)=>blocking(b).length-blocking(a).length||issues(b).length-issues(a).length);
  const clean=sub.filter(p=>!blocking(p).length);
  return `<div class="note">La revue contrôle chaque dossier soumis avant approbation. Une anomalie <b>bloquante</b> (en rouge) empêche l'approbation tant qu'elle n'est pas corrigée ; les autres sont des points d'attention.</div>
  <div class="kpis"><button class="kpi" onclick="UI.rule='';render()" style="${UI.rule?'':'border-color:var(--blue)'}"><small>File de revue</small><b class="num">${sub.length}</b><em>${clean.length} sans anomalie bloquante</em></button>
   ${RULES.map(r=>{const n=live.filter(p=>issues(p).includes(r[0])).length;return `<button class="kpi" onclick="UI.rule='${r[0]}';render()" style="${UI.rule===r[0]?'border-color:var(--blue)':''}"><small>${r[1]}</small><b class="num" style="color:${n?(r[2]?'var(--bad)':'var(--warn)'):'var(--ink3)'}">${n}</b><em>${r[2]?'bloquant':'attention'}</em></button>`}).join('')}</div>
  <div class="card"><div class="card-h"><h3>${UI.rule?esc(rule(UI.rule)[1])+' — tous statuts':'Dossiers soumis à valider'}</h3><span class="sp"></span>
   ${can('review')&&!UI.rule&&clean.length?`<button class="btn ok" onclick="approveClean()">Approuver les ${clean.length} dossiers conformes</button>`:''}
   ${can('export')?`<button class="btn" onclick="xlsxOut('revue_donnees',()=>[{title:'Revue des données',rows:[HEAD_FR,...RV.map(line)]}])">Exporter (Excel)</button>`:''}</div>
   <div class="tw"><table class="t"><thead><tr><th>Titulaire</th><th>Catégorie</th><th>Organisation</th><th>Anomalies</th><th>Statut</th><th></th></tr></thead><tbody>
   ${(RV=rows).slice(0,80).map(p=>`<tr class="row" onclick="openP('${p.id}')"><td><b>${esc(nm(p))}</b><small class="num">${p.id}</small></td><td>${esc(cat(p.cat).l)}</td><td>${esc(p.org)}</td><td>${issChips(p)}</td><td>${pill(p.st)}</td>
    <td class="r" onclick="event.stopPropagation()" style="white-space:nowrap">${can('review')&&p.st==='SUB'?`<button class="btn sm" ${blocking(p).length?'disabled title="Anomalie bloquante"':''} onclick="setSt('${p.id}','APP',null,1)&&(render(),toast('Dossier approuvé'))">Approuver</button> <button class="btn sm" onclick="askWhy('${p.id}','RET')">Renvoyer</button>`:''}${can('review')&&issues(p).length?` <button class="btn sm" onclick="notifyAsk('${p.id}')">Notifier</button>`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Rien à traiter.</td></tr>'}
   </tbody></table></div>${rows.length>80?`<div class="pg">80 premiers dossiers affichés sur ${rows.length}. Exportez pour la liste complète.</div>`:''}</div>`;
};
let RV=[];
function approveClean(){let n=0;PS().filter(p=>p.st==='SUB').forEach(p=>{if(setSt(p.id,'APP',null,1))n++});render();toast(n+' dossier(s) approuvé(s)')}

/* ============ Vérifications ============ */
V.verif=()=>{
  const rows=PS().filter(p=>p.bg!=='OK'&&p.st!=='REJ');
  return `<div class="kpis">${[['En attente',rows.filter(p=>p.bg==='PEND').length],['Signalées',rows.filter(p=>p.bg==='FLAG').length],['Conformes',PS().filter(p=>p.bg==='OK').length]].map(x=>`<div class="kpi" style="cursor:default"><small>${x[0]}</small><b class="num">${x[1]}</b></div>`).join('')}</div>
  <div class="card"><div class="card-h"><h3>Vérifications à statuer</h3></div><div class="tw"><table class="t"><thead><tr><th>Titulaire</th><th>Catégorie</th><th>Organisation</th><th>État</th><th>Dossier</th><th></th></tr></thead><tbody>
  ${rows.map(p=>`<tr class="row" onclick="openP('${p.id}')"><td><b>${esc(nm(p))}</b><small class="num">${p.id}</small></td><td>${esc(cat(p.cat).l)}</td><td>${esc(p.org)}</td><td>${p.bg==='FLAG'?'<span class="chip b">Signalée</span>':'<span class="chip w">En attente</span>'}</td><td>${pill(p.st)}</td>
   <td class="r" onclick="event.stopPropagation()" style="white-space:nowrap">${can('review')?`<button class="btn sm" onclick="setBg('${p.id}','OK')">Conforme</button> ${p.bg!=='FLAG'?`<button class="btn sm bad" onclick="setBg('${p.id}','FLAG')">Signaler</button>`:''}`:''}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Toutes les vérifications sont statuées.</td></tr>'}</tbody></table></div></div>`;
};
function setBg(id,v){const p=P(id);p.bg=v;log('Vérification',`${nm(p)} → ${v==='OK'?'conforme':'signalée'}`,id);render()}

/* ============ Matrice d'accès ============ */
V.matrix=()=>{
  const ed=can('matrix'),dis=ed?'':'disabled';
  return `<div class="note">La matrice définit les droits par défaut de chaque catégorie. Elle alimente directement le recto et le verso de l'accréditation. Les exceptions individuelles passent par « Ajouts d'accès ».</div>
  <div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Droits par catégorie</h3></div><div class="tw"><table class="t mx"><thead><tr><th rowspan="2">Catégorie</th><th colspan="${S.zones.length}" style="border-left:1px solid var(--line)">Zones</th><th colspan="${S.privs.length}" style="border-left:1px solid var(--line)">Privilèges</th><th rowspan="2" style="border-left:1px solid var(--line)">Restau-<br>ration</th></tr>
   <tr>${S.zones.map((z,i)=>`<th title="${esc(z.n)}"${i?'':' style="border-left:1px solid var(--line)"'}>${esc(z.c)}</th>`).join('')}${S.privs.map((x,i)=>`<th title="${esc(x.n)}"${i?'':' style="border-left:1px solid var(--line)"'}>${esc(x.c)}</th>`).join('')}</tr></thead><tbody>
   ${S.cats.map(c=>{const m=S.matrix[c.c];return `<tr><td><i class="cat-d" style="background:${c.col}"></i><b>${esc(c.l)}</b></td>
    ${S.zones.map(z=>`<td><input type="checkbox" ${dis} ${m.z.includes(z.c)?'checked':''} onchange="mx('${c.c}','z','${z.c}')" aria-label="${esc(c.l)} ${esc(z.c)}"></td>`).join('')}
    ${S.privs.map(x=>`<td><input type="checkbox" ${dis} ${m.p.includes(x.c)?'checked':''} onchange="mx('${c.c}','p','${x.c}')" aria-label="${esc(c.l)} ${esc(x.c)}"></td>`).join('')}
    <td><input type="checkbox" ${dis} ${m.m?'checked':''} onchange="mx('${c.c}','m')" aria-label="${esc(c.l)} restauration"></td></tr>`}).join('')}</tbody></table></div></div>
  <div class="grid g2">
   <div class="card"><div class="card-h"><h3>Zones</h3><span class="sp"></span>${ed?`<button class="btn sm p" onclick="refEdit('zones',-1)">Ajouter une zone</button>`:''}</div><div class="tw"><table class="t"><tbody>
    ${S.zones.map((z,i)=>`<tr><td style="width:70px"><span class="chip k"${z.o?' style="background:#fff;color:#000;box-shadow:inset 0 0 0 1.500px #000"':''}>${esc(z.c)}</span></td><td>${esc(z.n)}<small>${z.o?'Hors compétition (encadré)':'Site de compétition'}</small></td><td class="r">${ed?`<button class="btn sm" onclick="refEdit('zones',${i})">Modifier</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>
   <div class="card"><div class="card-h"><h3>Privilèges</h3><span class="sp"></span>${ed?`<button class="btn sm p" onclick="refEdit('privs',-1)">Ajouter un privilège</button>`:''}</div><div class="tw"><table class="t"><tbody>
    ${S.privs.map((x,i)=>`<tr><td style="width:70px"><span class="chip x">${esc(x.c)}</span></td><td>${esc(x.n)}</td><td class="r">${ed?`<button class="btn sm" onclick="refEdit('privs',${i})">Modifier</button>`:''}</td></tr>`).join('')}</tbody></table></div></div></div>`;
};
function mx(c,k,code){const m=S.matrix[c];if(k==='m')m.m=m.m?0:1;else{const i=m[k].indexOf(code);i<0?m[k].push(code):m[k].splice(i,1)}
  log('Matrice d\'accès',`${cat(c).l} : ${k==='m'?'restauration':(k==='z'?'zone ':'privilège ')+code} ${k==='m'?(m.m?'activée':'retirée'):(m[k].includes(code)?'ajouté':'retiré')}`);render()}
function refEdit(kind,i){const zn=kind==='zones',o=i<0?{c:'',n:'',o:0}:S[kind][i];
  modal((i<0?'Ajouter':'Modifier')+(zn?' une zone':' un privilège'),`<div class="form"><div class="fld"><label for="r-c">Code (imprimé sur l'accréditation)</label><input class="inp" id="r-c" maxlength="${zn?3:1}" value="${esc(o.c)}" ${i<0?'':'disabled'} style="text-transform:uppercase"></div>
   <div class="fld"><label for="r-n">Libellé (légende du verso)</label><input class="inp" id="r-n" value="${esc(o.n)}"></div>
   ${zn?`<label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="r-o" ${o.o?'checked':''}> Zone hors compétition (case encadrée au lieu de pleine)</label>`:''}</div>`,
  `${i>=0?`<button class="btn bad" style="margin-right:auto" onclick="refDel('${kind}',${i})">Supprimer</button>`:''}<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn p" onclick="refSave('${kind}',${i})">Enregistrer</button>`)}
function refSave(kind,i){const c=$('#r-c').value.trim().toUpperCase(),n=$('#r-n').value.trim();if(!c||!n){toast('Code et libellé obligatoires');return}
  if(i<0){if(S[kind].some(x=>x.c===c)){toast('Ce code existe déjà');return}S[kind].push({c,n,o:kind==='zones'&&$('#r-o').checked?1:0})}else{S[kind][i].n=n;if(kind==='zones')S[kind][i].o=$('#r-o').checked?1:0}
  log('Matrice d\'accès',`${kind==='zones'?'Zone':'Privilège'} ${c} ${i<0?'créé':'modifié'} (${n})`);closeAll();render()}
function refDel(kind,i){const c=S[kind][i].c,k=kind==='zones'?'z':'p',xk=kind==='zones'?'xz':'xp';S[kind].splice(i,1);
  Object.values(S.matrix).forEach(m=>m[k]=m[k].filter(x=>x!==c));S.persons.forEach(p=>p[xk]=p[xk].filter(x=>x!==c));
  log('Matrice d\'accès',`${kind==='zones'?'Zone':'Privilège'} ${c} supprimé`);closeAll();render()}

/* ============ Ajouts d'accès ============ */
const rqLabel=q=>q.type==='meal'?'Restauration':q.type==='zone'?`Zone <span class="chip k">${esc(q.code)}</span>`:`Privilège <span class="chip x">${esc(q.code)}</span>`;
V.acces=()=>{
  const rows=S.reqs.filter(q=>!UI.rq||q.st===UI.rq),n=k=>S.reqs.filter(q=>q.st===k).length;
  return `<div class="note">Un ajout d'accès accorde à une personne une zone ou un privilège en plus de ceux de sa catégorie. Une fois accordé, il apparaît sur son accréditation ; si elle est déjà imprimée, une réimpression est nécessaire.</div>
  <div class="card"><div class="card-h"><div class="tabs">${[['PEND','En attente'],['OK','Accordés'],['NO','Refusés'],['','Tous']].map(t=>`<button class="tab${UI.rq===t[0]?' on':''}" onclick="UI.rq='${t[0]}';render()">${t[1]} <span class="num">${t[0]?n(t[0]):S.reqs.length}</span></button>`).join('')}</div><span class="sp"></span>
   ${can('export')?`<button class="btn" onclick="runExport('acc')">Exporter</button>`:''}${can('edit')?`<button class="btn p" onclick="reqNew('')">Nouvelle demande</button>`:''}</div>
  <div class="tw"><table class="t"><thead><tr><th>Réf.</th><th>Titulaire</th><th>Ajout demandé</th><th>Justification</th><th>Demandé par</th><th>État</th><th></th></tr></thead><tbody>
  ${rows.map(q=>{const p=P(q.pid);return `<tr class="row" onclick="openP('${q.pid}')"><td class="num">${q.id}</td><td><b>${esc(nm(p))}</b><small>${p?esc(cat(p.cat).l)+' · '+ST[p.st]:''}</small></td><td>${rqLabel(q)}</td><td style="max-width:260px">${esc(q.motif)}</td><td>${esc(q.by)}<small class="num">${fmtT(q.t)}</small></td><td>${pill(q.st,RQ)}${q.dec?`<small>${esc(q.dec)}</small>`:''}</td>
   <td class="r" onclick="event.stopPropagation()" style="white-space:nowrap">${q.st==='PEND'&&can('access')?`<button class="btn sm ok" onclick="reqDecide('${q.id}',1)">Accorder</button> <button class="btn sm bad" onclick="reqDecide('${q.id}',0)">Refuser</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Aucune demande.</td></tr>'}</tbody></table></div></div>`;
};
function reqNew(pid){
  modal('Demande d\'ajout d\'accès',`<div class="form"><div class="fld full"><label for="q-p">Titulaire (n° de dossier)</label><input class="inp" id="q-p" list="q-l" value="${esc(pid)}" placeholder="Tapez un nom puis choisissez"><datalist id="q-l">${S.persons.filter(p=>p.st!=='REJ').map(p=>`<option value="${p.id}">${esc(nm(p))} — ${esc(cat(p.cat).l)}</option>`).join('')}</datalist></div>
   <div class="fld"><label for="q-t">Type</label><select class="inp" id="q-t" onchange="$('#q-c').innerHTML=reqCodes(this.value);$('#q-c').disabled=this.value==='meal'">${opt([['zone','Zone'],['priv','Privilège'],['meal','Restauration']],'zone')}</select></div>
   <div class="fld"><label for="q-c">Code</label><select class="inp" id="q-c">${reqCodes('zone')}</select></div>
   <div class="fld full"><label for="q-m">Justification opérationnelle (obligatoire)</label><textarea class="inp" id="q-m"></textarea></div></div>`,
  `<button class="btn" onclick="closeOv(this)">Annuler</button><button class="btn p" onclick="reqSave()">Envoyer la demande</button>`)}
const reqCodes=t=>t==='meal'?'<option value="">—</option>':opt((t==='zone'?S.zones:S.privs).map(x=>[x.c,x.c+' — '+x.n]),'');
function reqSave(){const pid=$('#q-p').value.trim(),p=P(pid),type=$('#q-t').value,code=$('#q-c').value,motif=$('#q-m').value.trim();
  if(!p){toast('Dossier introuvable : choisissez un titulaire dans la liste');return}if(!motif){toast('La justification est obligatoire');return}
  const e=eff(p);if((type==='zone'&&e.z.some(z=>z.c===code))||(type==='priv'&&e.p.some(x=>x.c===code))||(type==='meal'&&e.m)){toast('Ce droit est déjà attribué à cette personne');return}
  const id='AA-'+String(Math.max(0,...S.reqs.map(q=>parseInt(q.id.slice(3))))+1).padStart(3,'0');S.reqs.unshift({id,pid,type,code,motif,by:me().n,t:Date.now(),st:'PEND',dec:''});
  log('Ajouts d\'accès',`Demande ${id} pour ${nm(p)}`,pid);closeAll();UI.rq='PEND';go('acces',1);toast('Demande '+id+' enregistrée')}
function reqDecide(id,ok){const q=S.reqs.find(x=>x.id===id),p=P(q.pid);q.st=ok?'OK':'NO';q.dec=me().n;
  if(ok&&p){if(q.type==='zone')p.xz.push(q.code);else if(q.type==='priv')p.xp.push(q.code);else p.xm=1}
  log('Ajouts d\'accès',`Demande ${id} ${ok?'accordée':'refusée'} (${nm(p)})`,q.pid);render();
  toast(ok?(p&&['PRT','DLV'].includes(p.st)?'Accordé — accréditation déjà imprimée : réimpression à prévoir':'Accès accordé et ajouté à l\'accréditation'):'Demande refusée')}
/* ============ Accréditation : rendu recto / verso ============ */
function qr(t){try{const q=qrcode(0,'M');q.addData(String(t));q.make();const n=q.getModuleCount();let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x} ${y}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><path d="${d}"/></svg>`}catch(e){return '<svg viewBox="0 0 10 10"><rect width="10" height="10" fill="none" stroke="#000" stroke-width=".4"/><text x="5" y="6" font-size="2" text-anchor="middle">QR</text></svg>'}}
function badge(p,back){
  const c=cat(p.cat),e=eff(p),T=S.tpl,ph=`<div class="b-ph">${p.photo?`<img src="${p.photo}" alt="">`:SIL}</div>`;
  const bar=`<div class="b-bar" style="background:${T.bar}">${e.p.map(x=>`<span>${esc(x.c)}</span>`).join('')}</div>`;
  if(back)return `<div class="bdg"><div class="b-bk">${ph}<div><h4>${esc(p.ln)}, ${esc(p.fn)}</h4><p>${esc(c.l)}</p><p class="i">${p.id}</p></div></div>
   ${T.showLeg?`<div class="b-leg"><div>${T.showZ?e.z.map(z=>`<div><i${z.o?' class="o"':''}>${esc(z.c)}</i><span>${esc(z.n)}</span></div>`).join(''):''}</div>
   <div>${e.p.map(x=>`<div><i class="n">${esc(x.c)}</i><span>${esc(x.n)}</span></div>`).join('')}<div><i class="c" style="background:${T.bar}"></i><span>${esc(T.gen)}</span></div>${T.showM&&e.m?`<div><i class="f">${FORK}</i><span>Restauration</span></div>`:''}</div></div>`:''}${bar}</div>`;
  return `<div class="bdg"><div class="b-top">${ph}<div class="b-tr"><div class="b-ev">${T.showEv?`${esc(T.ev)}<small>${esc(T.sub)}</small>`:''}</div><div class="b-ban" style="background:${c.col}">${esc(c.b)}</div></div></div>
   <div class="b-name">${esc(p.fn)} ${esc(p.ln.toUpperCase())}</div><div class="b-fn">${esc(c.l)}</div><div class="b-org">${esc(p.fct)}${p.fct&&p.org?' · ':''}${esc(p.org)}</div>
   <div class="b-mid">${T.showM&&e.m?`<div class="b-meal">${FORK}</div>`:''}<div class="b-qr"><b>${p.id}</b>${qr(p.id)}</div></div>
   ${T.showZ?`<div class="b-zones">${e.z.map(z=>`<div class="b-z${z.o?' o':''}"><span>${esc(z.c)}</span></div>`).join('')}</div>`:''}${bar}</div>`;
}

let PRN=[],PRL=[];
function printIds(ids,specimen){
  const ps=ids.map(P).filter(p=>p&&(specimen||['APP','PRT','DLV'].includes(p.st)));
  if(!ps.length){toast('Seuls les dossiers approuvés peuvent être imprimés');return}
  PRL=ps;PRN=specimen?[]:ps.filter(p=>p.st==='APP').map(p=>p.id);
  $('#printarea').innerHTML=ps.map(p=>`<div class="sheet">${badge(p)}${badge(p,1)}</div>`).join('');
  closeAll();
  modal(`Impression — ${ps.length} accréditation(s)`,`<div class="pair" style="max-height:52vh;overflow:auto">${ps.slice(0,3).map(p=>`<div style="display:flex;gap:10px;--bs:6.5px">${badge(p)}${badge(p,1)}</div>`).join('')}</div>
   <p style="margin:12px 0 0;font-size:12.5px;color:var(--ink2)">${ps.length>3?`Aperçu des 3 premières sur ${ps.length}. `:''}Une feuille A5 paysage (210 × 148 mm) par accréditation, recto et verso côte à côte, à plier ou couper au milieu. Le PDF (même mise en page) est téléchargé en même temps que l'impression, et les accréditations passent automatiquement au statut « Imprimé ».</p>`,
  `<button class="btn" onclick="closeOv(this)">Fermer</button><button class="btn" onclick="savePdf(PRL)">Télécharger le PDF</button><button class="btn p" onclick="printNow()">Imprimer + PDF</button>`,1);
}
function printNow(){savePdf(PRL);window.print();if(PRN.length)printDone();else closeAll()}
function printDone(){PRN.forEach(id=>setSt(id,'PRT',null,1));log('Impression',`Lot de ${PRN.length} accréditation(s) imprimé`);const n=PRN.length;PRN=[];SEL.clear();closeAll();render();toast(n+' accréditation(s) passée(s) automatiquement à « Imprimé »')}

/* Export Excel : relit d'abord la base, puis écrit un classeur typé (nombres, dates) avec en-têtes figés et filtres. */
async function xlsxOut(name,build){
  if(!window.ExcelJS){toast('Export Excel indisponible : le générateur n\'a pas pu être chargé');return}
  toast('Préparation du fichier Excel…');
  try{await flushNow();if(!await reload())return;
    const sheets=build(),now=new Date(),wb=new ExcelJS.Workbook();wb.creator=me().n;wb.created=now;
    const conv=v=>{if(typeof v==='number')return v;v=String(v??'');if(!v)return null;let m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return new Date(Date.UTC(+m[1],m[2]-1,+m[3]));
      m=v.match(/^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})$/);if(m)return new Date(Date.UTC(+m[3],m[2]-1,+m[1],+m[4],+m[5]));return v};
    const info=wb.addWorksheet('Informations');info.columns=[{width:30},{width:70}];
    [['Événement',S.tpl.ev],['Export',sheets.map(x=>x.title).join(', ')],['Généré le',now.toLocaleString('fr-FR')],['Généré par',me().n+' ('+me().role+')'],
     ['Source','Base de données de la plateforme, relue au moment de l\'export'],['Dossiers en base',S.persons.length],[],['Feuille','Lignes de données'],...sheets.map(x=>[x.title,x.rows.length-1])].forEach(r=>info.addRow(r));
    info.getColumn(1).font={bold:true};info.getRow(8).font={bold:true};
    const used=new Set(['informations']);
    sheets.forEach(sh=>{let nm=sh.title.replace(/[\[\]:*?\/\\']/g,' ').slice(0,31).trim(),i=2;while(used.has(nm.toLowerCase()))nm=nm.slice(0,28)+' '+i++;used.add(nm.toLowerCase());
      const ws=wb.addWorksheet(nm,{views:[{state:'frozen',ySplit:1}]}),H=sh.rows[0],n=H.length;
      ws.addRow(H);sh.rows.slice(1).forEach(r=>ws.addRow(r.map(conv)));
      const hr=ws.getRow(1);hr.height=22;for(let c=1;c<=n;c++){const cell=hr.getCell(c);cell.font={bold:true,color:{argb:'FFFFFFFF'}};cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1D4ED8'}};cell.alignment={vertical:'middle',wrapText:true}}
      ws.autoFilter={from:{row:1,column:1},to:{row:1,column:n}};
      for(let c=1;c<=n;c++){let w=String(H[c-1]).length,dt=0,dtm=0;sh.rows.slice(1,400).forEach(r=>{const v=r[c-1];w=Math.max(w,String(v??'').length);if(/^\d{4}-\d{2}-\d{2}$/.test(v))dt=1;if(/^\d{2}\/\d{2}\/\d{4} \d{2}:\d{2}$/.test(v))dtm=1});

  const fork=(X,Y,Sz)=>{rect(X,Y,Sz,Sz,[255,255,255],1);doc.setDrawColor(0,0,0);const l=(a,b,d,f,w)=>{doc.setLineWidth(w*Sz*U);doc.line(O+(X+a*Sz)*U,(Y+b*Sz)*U,O+(X+d*Sz)*U,(Y+f*Sz)*U)};
    l(.38,.2,.38,.8,.07);l(.3,.2,.3,.42,.045);l(.46,.2,.46,.42,.045);l(.3,.42,.46,.42,.045);l(.64,.2,.64,.8,.07);l(.67,.2,.67,.5,.12)};
  const bar=()=>{rect(2,38.4,28.5,5.4,rgb(T.bar));e.p.forEach((x,i)=>txt(x.c,2+28.5*(i+.5)/e.p.length,42.3,3.3,{al:'center',col:[255,255,255]}))};

    if(T.showLeg){let y=10.9;

      let r=0;e.p.forEach(x=>{const Y=y+r++*1.78;rect(16.75,Y,1.35,1.35,[255,255,255],1);txt(x.c,17.42,Y+1,.9,{b:1,al:'center'});txt(x.n,18.8,Y+.93,.74,{max:11.6})});

      if(T.showM&&e.m){Y=y+r++*1.78;fork(16.75,Y,1.35);txt('Restauration',18.8,Y+.93,.74)}}

  photo(2,2,11.6,14.6);
  if(T.showEv){txt(T.ev.toUpperCase(),30.5,2.95,.95,{b:1,al:'right',max:15});txt(T.sub,30.5,4.05,.8,{al:'right',col:[85,85,85],max:15})}
  rect(15.2,13.44,15.3,3.16,rgb(c.col));txt(c.b,22.85,15.55,1.55,{b:1,al:'center',col:[255,255,255],max:14.5});
  txt(p.fn+' '+p.ln.toUpperCase(),2,19.55,1.75,{max:28.5});txt(c.l,2,21.05,.98,{b:1,max:28.5});txt([p.fct,p.org].filter(Boolean).join(' · '),2,22.25,.98,{max:28.5});
  if(T.showM&&e.m)fork(8.6,28,2.6);

  modal('Message prêt, non envoyé automatiquement',`<div class="note w">${esc(j.reason)} Copiez le message et envoyez-le depuis votre messagerie.</div>
   <dl class="dl"><dt>Destinataire</dt><dd>${esc(j.to.join(', '))}</dd><dt>Objet</dt><dd>${esc(j.subject)}</dd></dl><textarea class="inp" readonly style="min-height:210px;margin-top:10px">${esc(j.text)}</textarea>`,
  `<button class="btn" onclick="copyTxt(NOTR.to.join(', '))">Copier l'adresse</button><button class="btn" onclick="copyTxt(NOTR.text)">Copier le message</button><button class="btn p" onclick="closeOv(this)">Fermer</button>`,1);
}
let NOTR=null;

/* ============ Formulaire public (lien d'invitation) ============ */
let FT='',FPH='';
const pubBox=h=>{$('#login').hidden=true;$('#app').hidden=true;const b=$('#pub');b.hidden=false;b.innerHTML=`<div class="login"><div class="brand" style="padding:0 0 6px"><div class="brand-m">DG</div><div><b>NDAGE 2026</b><span>Demande d'accréditation</span></div></div>${h}
  ${!FT&&CL?`<div style="border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink3)"><span style="flex:1 1 100%;overflow-wrap:anywhere">Connecté : ${esc(CL.email)}</span><button class="btn sm" type="button" onclick="pwForm()">Changer mon mot de passe</button><button class="btn sm" type="button" onclick="logout()">Déconnexion</button></div>`:''}</div>`};
function pwForm(){pubBox(`<h2>Changer mon mot de passe</h2><form onsubmit="pwSave(event)" style="display:flex;flex-direction:column;gap:12px">
  <div class="fld"><label for="pw-o">Mot de passe actuel</label><input class="inp" id="pw-o" type="password" required autocomplete="current-password"></div>
  <div class="fld"><label for="pw-n">Nouveau mot de passe (8 caractères minimum)</label><input class="inp" id="pw-n" type="password" required minlength="8" autocomplete="new-password"></div>
  <p id="p-err" role="alert" style="margin:0;min-height:18px;color:var(--bad);font-size:12.5px;font-weight:500"></p>
  <div class="tb"><button class="btn" type="button" onclick="showForm('')">Retour à mon dossier</button><button class="btn p" id="p-btn" type="submit">Enregistrer</button></div></form>`)}
async function pwSave(ev){ev.preventDefault();const b=$('#p-btn');b.disabled=true;let r;try{r=await api('/api/me',{oldPassword:$('#pw-o').value,newPassword:$('#pw-n').value})}catch(x){r={ok:false,j:{error:'Connexion au serveur impossible.'}}}
  b.disabled=false;if(!r.ok){$('#p-err').textContent=r.j.error||'Modification impossible.';return}
  pubBox('<h2>Mot de passe modifié</h2><p style="margin:0;color:var(--ink2)">Utilisez ce nouveau mot de passe à votre prochaine connexion.</p><button class="btn p" type="button" style="justify-content:center" onclick="showForm(\'\')">Retour à mon dossier</button>')}
async function showForm(token){
  FT=token;FPH='';pubBox('<p style="margin:0;color:var(--ink2)">Chargement…</p>');
  let r;try{r=await api(token?'/api/form?t='+encodeURIComponent(token):'/api/me')}catch(e){r={ok:false,j:{error:'Connexion au serveur impossible.'}}}
  if(!r.ok){pubBox(`<h2>${token?'Lien non valide':'Dossier indisponible'}</h2><p style="margin:0;color:var(--ink2)">${esc(r.j.error||'Ce lien ne fonctionne pas.')}${token?' Demandez un nouveau lien à votre organisation.':''}</p>`);return}
  const d=r.j,p=d.person||{ln:'',fn:'',addr:'',tel:'',fct:'',photo:''};
  const head=`<h2>${esc(d.event)}</h2><p style="margin:0;color:var(--ink2)">${esc(d.category)} · ${esc(d.org)}${d.group?' · '+esc(d.group):''}<br><span style="font-size:12px;color:var(--ink3)">${esc(d.email)}</span></p>`;
  if(!d.editable){pubBox(head+`<div class="note" style="margin:6px 0 0">Votre dossier a bien été reçu et est en cours de traitement (${esc(ST[d.status]||d.status)}). Il ne peut plus être modifié en ligne.</div>`);return}
  pubBox(head+`${d.note?`<div class="note w" style="margin:0"><b>À corriger :</b> ${esc(d.note)}</div>`:d.person?'<div class="note" style="margin:0">Votre dossier est déjà déposé. Vous pouvez encore le corriger ci-dessous.</div>':''}
  <form onsubmit="sendForm(event)" style="display:flex;flex-direction:column;gap:12px"><div class="form">
   <div class="fld"><label for="p-ln">Nom</label><input class="inp" id="p-ln" required maxlength="80" autocomplete="family-name" value="${esc(p.ln)}"></div>
   <div class="fld"><label for="p-fn">Prénom</label><input class="inp" id="p-fn" required maxlength="80" autocomplete="given-name" value="${esc(p.fn)}"></div>
   <div class="fld full"><label for="p-addr">Adresse</label><input class="inp" id="p-addr" required maxlength="200" autocomplete="street-address" value="${esc(p.addr)}"></div>
   <div class="fld"><label for="p-tel">Numéro de téléphone</label><input class="inp" id="p-tel" type="tel" required maxlength="40" autocomplete="tel" placeholder="+221 77 000 00 00" value="${esc(p.tel)}"></div>
   <div class="fld"><label for="p-fct">Fonction</label><input class="inp" id="p-fct" required maxlength="120" value="${esc(p.fct)}"></div>
   <div class="fld full"><label for="p-ph">Photo d'identité (visage de face, fond clair)</label><div class="pub-ph">${p.photo?`<img id="p-prev" src="${p.photo}" alt="Photo actuelle">`:'<img id="p-prev" alt="" hidden><div class="ph0" id="p-ph0"></div>'}<input class="inp" id="p-ph" type="file" accept="image/*" onchange="formPh(this)" style="flex:1"></div></div></div>
   <p id="p-err" role="alert" style="margin:0;min-height:18px;color:var(--bad);font-size:12.5px;font-weight:500"></p>
   <button class="btn p" id="p-btn" type="submit" style="justify-content:center;padding:10px">${d.person?'Mettre à jour mon dossier':'Envoyer ma demande'}</button></form>`);
  FHAS=!!p.photo;
}
let FHAS=false;
function formPh(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=348;c.height=438;const k=Math.max(348/im.width,438/im.height),w=im.width*k,h=im.height*k;c.getContext('2d').drawImage(im,(348-w)/2,(438-h)/2,w,h);FPH=c.toDataURL('image/jpeg',.82);const pv=$('#p-prev');pv.src=FPH;pv.hidden=false;const z=$('#p-ph0');if(z)z.remove()};im.onerror=()=>{$('#p-err').textContent='Image illisible : choisissez un fichier JPG ou PNG.'};im.src=rd.result};rd.readAsDataURL(f)}
async function sendForm(ev){ev.preventDefault();const e=$('#p-err'),b=$('#p-btn');e.textContent='';
  if(!FPH&&!FHAS){e.textContent='Ajoutez votre photo d\'identité.';return}
  b.disabled=true;let r;try{r=await api(FT?'/api/form':'/api/me',{t:FT,ln:$('#p-ln').value,fn:$('#p-fn').value,addr:$('#p-addr').value,tel:$('#p-tel').value,fct:$('#p-fct').value,photo:FPH})}catch(x){r={ok:false,j:{error:'Connexion au serveur impossible.'}}}
  b.disabled=false;if(!r.ok){e.textContent=r.j.error||'Envoi impossible.';return}
  pubBox('<h2>Demande transmise</h2><p style="margin:0;color:var(--ink2)">Merci. Votre dossier a bien été reçu par le service accréditation. Vous serez contacté(e) si un élément manque. Vous pouvez fermer cette page.</p>'+(FT?'':'<button class="btn" type="button" style="justify-content:center" onclick="showForm(\'\')">Revoir mon dossier</button>'));
}

/* ============ Démarrage ============ */
(async function(){const inv=new URLSearchParams(location.search).get('inv');if(inv){showForm(inv);return}const h=location.hash.slice(1);if(V[h])VIEW=h;try{await reload()}catch(e){showLogin('Serveur indisponible.')}})();
window.addEventListener('focus',()=>{if(S&&!TMR&&!$('#ovs').children.length&&Date.now()-LOADED>30000)SYNC.then(()=>{if(S&&!TMR&&!$('#ovs').children.length)reload()})});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(V[h]&&h!==VIEW)go(h)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=$('#ovs').lastElementChild;if(o)o.remove()}});
</script>
</body></html>
